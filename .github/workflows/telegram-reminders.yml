name: Telegram reminders
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-reminders.yml']
permissions:
  id-token: write
  contents: read
concurrency:
  group: telegram-reminders
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver due reminders
        env:
          REMINDER_SITE: https://closeby-notebook-k7m4.finiterose64.chatgpt.site
        run: |
          node --input-type=module <<'NODE'
          const site=process.env.REMINDER_SITE;
          const endpoint=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set('audience',site);
          const identity=await fetch(endpoint,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},signal:AbortSignal.timeout(20000)});
          if(!identity.ok)throw Error('Unable to obtain scheduler identity');
          const {value}=await identity.json();
          console.log('::add-mask::'+value);
          const response=await fetch(site+'/api/system/dispatch-reminders',{method:'POST',headers:{Authorization:'Bearer '+value},signal:AbortSignal.timeout(120000)});
          if(!response.ok)throw Error('Reminder dispatcher returned '+response.status);
          console.log(JSON.stringify(await response.json()));
          NODE
